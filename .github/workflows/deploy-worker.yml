name: Deploy Metaverse Worker

on:
  workflow_dispatch:

concurrency:
  group: metaverse-worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

# This repository remains workflow-only. The private Worker source is checked
# out ephemerally during the job and is never committed to this public repo.
# Required encrypted secrets:
#   RENDER_SOURCE_TOKEN    read access to MohiZia/Metaverse
#   CLOUDFLARE_API_TOKEN   restricted Worker deployment token
#   CLOUDFLARE_ACCOUNT_ID  5b5afe2289139ae25318845c3b82fb73

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: metaverse-source/cloud/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Worker source ephemerally
        uses: actions/checkout@v4
        with:
          repository: MohiZia/Metaverse
          ref: main
          token: ${{ secrets.RENDER_SOURCE_TOKEN }}
          path: metaverse-source
          sparse-checkout: |
            cloud/worker
          sparse-checkout-cone-mode: true

      - name: Validate deployment credentials are configured
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is not configured'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = '5b5afe2289139ae25318845c3b82fb73' || { echo 'CLOUDFLARE_ACCOUNT_ID is missing or incorrect'; exit 1; }

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Run Worker tests
        run: npm test

      - name: Deploy Worker
        run: npx wrangler deploy
