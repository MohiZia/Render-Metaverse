
name: Deploy Metaverse Worker

on:
  workflow_dispatch:

concurrency:
  group: metaverse-worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: metaverse-source/cloud/worker

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout private Worker source
        uses: actions/checkout@v6
        with:
          repository: MohiZia/Metaverse
          ref: main
          token: ${{ secrets.RENDER_SOURCE_TOKEN }}
          path: metaverse-source
          sparse-checkout: cloud/worker
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Validate deployment credentials
        working-directory: .
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::CLOUDFLARE_API_TOKEN is missing"
            exit 1
          }

          test "$CLOUDFLARE_ACCOUNT_ID" = \
            "5b5afe2289139ae25318845c3b82fb73" || {
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing or incorrect"
            exit 1
          }

          test -f metaverse-source/cloud/worker/package.json || {
            echo "::error::Worker package.json was not checked out"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: metaverse-source/cloud/worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Worker tests
        run: npm test

      - name: Deploy Worker
        run: npx --no-install wrangler deploy
