name: Render Metaverse backlog

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Jobs to claim per batch (1-6)
        default: "3"
        type: choice
        options: ["1", "2", "3", "4", "5", "6"]
      budget_minutes:
        description: Render budget, below the job timeout
        default: "45"
        type: choice
        options: ["10", "20", "30", "45"]
      render_profile:
        description: Story visuals (existing per-video settings take priority)
        default: balanced
        type: choice
        options: [balanced, cinematic, expressive, reduced_motion]
      narration_style:
        description: Story narration fallback (preserves explicit per-video tone)
        default: per_video
        type: choice
        options: [per_video, narrative, funny, quote, poetry, romance, sad]
  repository_dispatch:
    types: [render-metaverse]
  schedule:
    - cron: "20 */2 * * *"

concurrency:
  group: metaverse-renderer
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

# This public repository intentionally contains only this workflow.
# Runtime requirement: RENDER_SOURCE_TOKEN is an encrypted GitHub token that can
# read MohiZia/Metaverse. Worker access uses short-lived GitHub OIDC instead of
# a long-lived Worker token.
# No credentials, application code, internal data, or publishing code is committed here.

env:
  MV_API: ${{ vars.MV_API || 'https://metaverse-autopilot.zyyabot.workers.dev' }}
  MV_OIDC_AUDIENCE: metaverse-autopilot
  MV_BUDGET_MIN: ${{ inputs.budget_minutes || github.event.client_payload.budget_minutes || '45' }}
  MV_RENDER_PROFILE: ${{ inputs.render_profile || github.event.client_payload.render_profile || 'balanced' }}
  MV_NARRATION_STYLE: ${{ inputs.narration_style || github.event.client_payload.narration_style || 'per_video' }}
  MV_BATCH: ${{ inputs.batch || github.event.client_payload.batch || '3' }}

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Validate render controls
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          allowed = {
              "MV_RENDER_PROFILE": {"balanced", "cinematic", "expressive", "reduced_motion"},
              "MV_NARRATION_STYLE": {"per_video", "narrative", "funny", "quote", "poetry", "romance", "sad"},
              "MV_BATCH": {str(n) for n in range(1, 7)},
              "MV_BUDGET_MIN": {"10", "20", "30", "45"},
          }
          for key, values in allowed.items():
              if os.environ.get(key) not in values:
                  raise SystemExit(f"Invalid {key}; select a supported workflow input")
          PY

      - name: Check render backlog
        id: backlog
        shell: bash
        run: |
          set -euo pipefail
          oidc="$(curl --connect-timeout 10 --max-time 45 --retry 2 --retry-delay 2 --retry-max-time 100 -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$MV_OIDC_AUDIENCE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$oidc"
          response="$(curl --connect-timeout 10 --max-time 45 --retry 2 --retry-delay 2 --retry-max-time 100 -fsS -H "Authorization: Bearer $oidc" "$MV_API/api/runner/pending")"
          pending="$(python3 -c 'import json,sys; d=json.load(sys.stdin); n=d.get("claimable", d.get("pending")); assert isinstance(n,int) and not isinstance(n,bool) and n >= 0, "Invalid pending count"; print(n)' <<< "$response")"
          echo "Claimable render jobs: $pending"
          if [ "$pending" -gt 0 ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; else echo 'run=false' >> "$GITHUB_OUTPUT"; fi

      - name: Checkout only renderer modules from private source
        if: steps.backlog.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          repository: MohiZia/Metaverse
          ref: main
          token: ${{ secrets.RENDER_SOURCE_TOKEN }}
          path: renderer-source
          persist-credentials: false
          sparse-checkout: |
            scripts/render_short.py
            scripts/render_profiles.py
            scripts/story_renderer.py
            scripts/kids_music.py
            scripts/sfx.py
            scripts/html_video
            video
          sparse-checkout-cone-mode: false

      - name: Set up Python
        if: steps.backlog.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node for HTML video tasks
        if: steps.backlog.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: renderer-source/video/package-lock.json

      - name: Install renderer dependencies
        if: steps.backlog.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core megatools > /dev/null
          python3 -m pip install --disable-pip-version-check -q edge-tts gTTS pillow numpy
          npm ci --prefix renderer-source/video --ignore-scripts
          mkdir -p ~/.cache/mvfonts
          curl --connect-timeout 10 --max-time 45 --retry 2 -fsSL -o ~/.cache/mvfonts/Fredoka.ttf "https://github.com/google/fonts/raw/main/ofl/fredoka/Fredoka%5Bwdth,wght%5D.ttf" || echo "::warning::Fredoka unavailable; using installed DejaVu font"
          python3 -m compileall -q renderer-source/scripts

      - name: Render and upload queued videos
        if: steps.backlog.outputs.run == 'true'
        working-directory: renderer-source
        env:
          PYTHONPATH: scripts
        run: python3 scripts/render_short.py

      - name: Report render outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          BACKLOG_RUN: ${{ steps.backlog.outputs.run }}
        shell: bash
        run: |
          {
            echo "### Metaverse renderer"
            echo "- Job status: $JOB_STATUS"
            echo "- Claimable backlog found: ${BACKLOG_RUN:-unknown}"
            echo "- Story profile: $MV_RENDER_PROFILE; narration fallback: $MV_NARRATION_STYLE"
            echo "- Batch size: $MV_BATCH; budget: $MV_BUDGET_MIN minutes"
            echo "- Per-video success/failure is reported to the Worker by the renderer."
          } >> "$GITHUB_STEP_SUMMARY"
